name: Mise à jour de l'actu

on:
  schedule:
    - cron: "7 * * * *"   # toutes les heures (GitHub peut avoir quelques minutes de retard)
  workflow_dispatch:       # bouton « Run workflow » pour lancer à la main
    inputs:
      essai:
        description: "Envoyer une notification d'essai"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  maj:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.envoi.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: pages
        uses: actions/configure-pages@v5
      - name: Reprendre les données du passage d'avant
        run: curl -fsSL "${{ steps.pages.outputs.base_url }}/data.json" -o site/data.json || echo "Premier passage, pas de données d'avant"
      - name: Ramasser l'actu
        run: python ramasseur.py
      - name: Envoyer les notifications
        env:
          CLE_PRIVEE_NOTIFS: ${{ secrets.CLE_PRIVEE_NOTIFS }}
          ABONNES_NOTIFS: ${{ secrets.ABONNES_NOTIFS }}
          ADRESSE_SITE: ${{ steps.pages.outputs.base_url }}
          NOTIF_ESSAI: ${{ inputs.essai }}
        if: env.CLE_PRIVEE_NOTIFS != '' && env.ABONNES_NOTIFS != ''
        run: pip install --quiet pywebpush && python notifs.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: envoi
        uses: actions/deploy-pages@v4
